services:
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo-prod
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build: ./server
    container_name: ecommerce-server-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ecommerce
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CLIENT_URL: http://localhost
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    container_name: ecommerce-client-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data:
