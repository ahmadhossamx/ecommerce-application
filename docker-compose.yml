services:
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build: ./server
    container_name: ecommerce-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ecommerce
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src

  client:
    build:
      context: ./client
      target: development
    container_name: ecommerce-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html

volumes:
  mongo-data:
