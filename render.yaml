# Render Blueprint — ecommerce-application backend
# In Render: New → Blueprint → connect ahmadhossamx/ecommerce-application.
# Render will create the service below. Set the env vars in the dashboard
# (MONGO_URI from MongoDB Atlas, JWT_SECRET to a long random string).
# Free tier: service sleeps after 15 min idle, first request takes ~30-60s to wake.
services:
  - type: web
    name: ecommerce-api
    env: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ahmadhossamx.github.io
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
